[workspace]
resolver = "3"
members = [
    "crates/pounce-common",
    "crates/pounce-linalg",
    "crates/pounce-linsol",
    "crates/pounce-nlp",
    "crates/pounce-nl",
    "crates/pounce-hsl",
    "crates/pounce-feral",
    "crates/pounce-algorithm",
    "crates/pounce-restoration",
    "crates/pounce-presolve",
    "crates/pounce-l1penalty",
    "crates/pounce-qp",
    "crates/pounce-convex",
    "crates/pounce-sens-core",
    "crates/pounce-sensitivity",
    "crates/pounce-solve-report",
    "crates/pounce-observability",
    "crates/pounce-cinterface",
    "crates/pounce-py",
    "crates/pounce-cli",
    "crates/pounce-rs",
    "crates/pounce-studio-core",
    "crates/pounce-studio-pyo3",
    "crates/pounce-wasm",
    "tools/iter-diff",
]
# Default `cargo build` / `cargo test` skip pounce-hsl so the pure-Rust
# build needs no Fortran/HSL toolchain. To build with the HSL MA57
# backend: `cargo build -p pounce-cli --features ma57`. The pounce-py
# crate is in members so plain `cargo check -p pounce-py` works for
# type-checking, but a wheel build still goes through `cd python &&
# maturin develop` (which enables the `extension-module` feature).
default-members = [
    "crates/pounce-common",
    "crates/pounce-linalg",
    "crates/pounce-linsol",
    "crates/pounce-nlp",
    "crates/pounce-nl",
    "crates/pounce-feral",
    "crates/pounce-algorithm",
    "crates/pounce-restoration",
    "crates/pounce-presolve",
    "crates/pounce-l1penalty",
    "crates/pounce-qp",
    "crates/pounce-convex",
    "crates/pounce-sens-core",
    "crates/pounce-sensitivity",
    "crates/pounce-solve-report",
    "crates/pounce-observability",
    "crates/pounce-cinterface",
    "crates/pounce-cli",
    "crates/pounce-rs",
    "crates/pounce-studio-core",
    "tools/iter-diff",
]

[workspace.package]
version = "0.11.0"
edition = "2024"
license = "EPL-2.0"
authors = ["John Kitchin <jkitchin@andrew.cmu.edu>"]
repository = "https://github.com/jkitchin/pounce"

# Internal + pinned external deps live here so `cargo publish` sees a
# `version =` on every path dep (cargo refuses to publish crates whose
# deps lack a registry version). Crates pick these up via
# `pounce-foo.workspace = true`.
[workspace.dependencies]
pounce-common = { path = "crates/pounce-common", version = "0.11.0" }
pounce-linalg = { path = "crates/pounce-linalg", version = "0.11.0" }
pounce-linsol = { path = "crates/pounce-linsol", version = "0.11.0" }
pounce-nlp = { path = "crates/pounce-nlp", version = "0.11.0" }
pounce-nl = { path = "crates/pounce-nl", version = "0.11.0" }
pounce-hsl = { path = "crates/pounce-hsl", version = "0.11.0" }
pounce-feral = { path = "crates/pounce-feral", version = "0.11.0" }
pounce-algorithm = { path = "crates/pounce-algorithm", version = "0.11.0" }
pounce-restoration = { path = "crates/pounce-restoration", version = "0.11.0" }
pounce-presolve = { path = "crates/pounce-presolve", version = "0.11.0" }
pounce-l1penalty = { path = "crates/pounce-l1penalty", version = "0.11.0" }
pounce-qp = { path = "crates/pounce-qp", version = "0.11.0" }
pounce-convex = { path = "crates/pounce-convex", version = "0.11.0" }
pounce-sens-core = { path = "crates/pounce-sens-core", version = "0.11.0" }
pounce-sensitivity = { path = "crates/pounce-sensitivity", version = "0.11.0" }
pounce-solve-report = { path = "crates/pounce-solve-report", version = "0.11.0" }
pounce-studio-core = { path = "crates/pounce-studio-core", version = "0.11.0" }
pounce-observability = { path = "crates/pounce-observability", version = "0.11.0" }
# feral: pinned to the published crates.io release so the pounce crates stay
# publishable — a git rev would block the crates.io publish and is rejected by
# scripts/check-release-consistency.sh ("git dependency … needs a crates.io
# version"). 0.11.x ships the formerly-unreleased MC64/scaling perf work (#80),
# LU basis engine (#81), and correctness campaign (#82/#83) that we previously
# carried locally via a git patch. 0.11.1 adds a Forrest–Tomlin bump
# re-triangularization fast path (a bump-local sub-diagonal pivot index that
# drops the O(bump²) pivot-selection scan) — bit-identical numerics, no API
# change, big speedup on wide sparse LPs like lifted-McCormick relaxations
# (~15.8× on the casctanks root LP solve). 0.11.2 pools the Forrest–Tomlin
# `SparseLu::update` scratch buffers (≈1804→82 heap allocs/update, ~31% faster
# on a 144-update replay chain) — again bit-identical numerics, no API change.
# 0.12.0 fixes the qap15/mittelmann conic-KKT family end to end: (#91) the
# `OrderingPreprocess::Auto` verify no longer inflates fill via a misfiring
# MC64 `LdltCompress` trigger (qap15 factor 15.4s→0.77s, ~20×); (#99) a packed
# BLAS-3 dense trailing update (~8–10× on large dense fronts); (#102) fixes a
# latent re-entrant nested-rayon workspace-mutex self-deadlock the #91 ordering
# exposed (cont5_2_4_l/dirichlet120 no longer stall at 0% CPU); and (#105)
# escalates the ordering to `LdltCompress` on pivot growth >1e24 so the
# fill-preferred `None` path can't degrade factorization accuracy on late μ→0
# IPM KKTs (restores cont5_2_4_l to 14 iters). Net for pounce: qap15 converges
# (was a 300s timeout) with no regressions — full mittelmann/LP/QP suites stay
# bit-identical. 0.13.0 adds `OrderingMethod::External(Vec<usize>)` (#107) so a
# caller can inject a precomputed fill-reducing permutation (Schur/tearing
# reuse) instead of only picking an ordering *algorithm*; `OrderingMethod` is
# now `Clone` but no longer `Copy`. 0.14.0 is a pure-perf release aimed at the
# IPM-host warm-refactor workload (one pattern, thousands of factorizations,
# exactly pounce): (#127) splits the symbolic pipeline so the `Auto`/`AutoRace`
# ordering races run the expensive tail only for the winner; (#124) reuses the
# permute cache on the default parallel driver so a warm re-factor scatters in
# O(nnz) instead of rebuilding+re-sorting triplets every iteration; (#126)
# fuses the D-block solve into forward substitution (~14–29% faster warm
# solves); plus opt-in tree-parallel sparse solve (#131) and analysis-time
# assembly maps (#125). All bit-identical numerics, no breaking API change.
# 0.15.0 fixes the parallel driver's task granularity (#148): it now spawns one
# rayon task per *subtree* rather than one boxed task per supernode (~1.8M
# allocations per solve on chain-structured problems), and a chain-shaped tree
# collapses to a single task and takes the sequential driver outright. This is
# the release that addresses the factorization gap in #552: on the six dumped
# pounce KKTs, paired A/B against 0.14.0 on the parallel driver — which is what
# pounce ships, since `FeralConfig.parallel` defaults to `None` — gives clnlbeam
# 2.29×, steering_12800 1.73×, dtoc2/rocket_12800 1.16×, dtoc1nd 1.14×. Also
# makes the x86_64 pulp dispatch actually vectorize (every pulp kernel had been
# executing its lane ops as outlined calls, ~10× kernel slowdown, invisible on
# aarch64) and turns the packed BLAS-3 trailing update into an explicit SIMD
# kernel. Scheduling- and codegen-only: factors are byte-identical, verified
# upstream by `tests/task_plan_parity.rs` and hardcoded `tests/golden_bits.rs`
# digests, and independently here by identical solve-vector hashes on all six
# KKTs. The one breaking change is diagnostic-only — `SupernodeTiming`,
# `BucketStats` and `ProfileReport` moved from `*_us` fields to `*_ns` (with
# `.us()` accessors kept for migration) — and pounce consumes none of it.
# 0.15.1 is a patch release with no API change, and is the counterpart to
# pounce #567: feral's `Solver` now derives `use_parallel` from
# `available_parallelism()` instead of hardcoding `true` (feral#154), and a
# `ThreadPoolBuilder::build()` failure falls back to the *sequential* driver
# rather than silently running on rayon's global pool (feral#156). Both matter
# to us — feral is in the `pounce-wasm` dependency tree, where the hardcoded
# `true` was simply wrong — and #567 already wrote `pounce-feral` against these
# semantics, so this bump is what makes that comment true. It also fixes an
# MC64 scaling-cache gate that compared a *minimum* against a *mean* and so
# rejected reuse on matrices that had not drifted at all (robot_1600:
# factorization −14.3%, scaling −39.8%), speeds the MC64 Hungarian matching
# 4–5% on large matchings (bit-identical over 51 matrices), and corrects a
# post-amalgamation `Supernode.nrow` underestimate. That last one is the only
# item with a behavioral edge: numeric factors and inertia are unaffected
# (`build_row_indices` always recomputed the true row set), but
# `estimate_assembly_flops` rises 2–3×, so matrices sitting just under
# `PAR_MIN_FLOPS` can now route to the parallel driver. We do not pin that
# threshold — `FeralConfig.min_par_flops` defaults to `None` — so we inherit
# feral's, and `feral_min_par_flops` / `POUNCE_FERAL_MIN_PAR_FLOPS` remain the
# override if the calibration turns out to want re-tuning.
#
# 0.16.0 changes the default LU pivoting rule: `SparseLu::factor` now runs
# threshold-Markowitz (feral#171) instead of factoring in the column order its
# `SparseLuSymbolic` argument carries. Markowitz picks the column order *during*
# the factorization, so it **ignores the symbolic entirely** — a caller that
# supplies an ordering and expects it honoured silently factors something else.
# All three pounce call sites do supply one, so all three now pass
# `pivoting: LuPivoting::GilbertPeierls` explicitly and are unchanged by the
# bump: `pounce-convex/src/simplex.rs` (crossover basis),
# `pounce-feral/src/lib.rs` (the AMD order the dependent-row/rank scan is
# written against) and `pounce-py/src/sparse_lu.rs` (whose docstring promises a
# cached symbolic makes a re-factor numeric-only — untrue under a rule that has
# no symbolic). Markowitz is a large *reported* win on LP bases
# (`factor_nnz()/nnz(B)` geomean 2.77x -> 1.06x over 16 preserved bases) at the
# cost of stability (max|U|/max|B| = 81.8 on QPLIB_1157_rlt1 against SuperLU's
# 2.56), so adopting it anywhere here is a measured change of its own and not
# part of a version bump. 0.16.0 also adds `LuParams::sparse_rhs_max_density`
# (feral#164), a density guard on the sparse-rhs ftran/btran entry points that
# pounce does not currently call.
#
# 0.17.0 is the release pounce asked for. Four items, in the order they matter
# here:
#
# (#178) `RefineOptions { max_steps }` and in-place solve entry points, both
# requested by gh#698 observation 5 and tracked as gh#710. feral's inner
# refinement budget was hard-coded at 10 correction steps, which is right for a
# caller that solves `Ax = b` and keeps the answer and wrong for one running its
# own refinement over the same system. `PdFullSpaceSolver` is the latter, so the
# loops nested: up to 10x11 substitution passes per augmented-system solve,
# measured at 60% of back-solve time (147.3 s vs 58.3 s) on a 118 276-dimension
# KKT. Only 10 and 0 were expressible before. `pounce-feral` now exposes the
# budget as `feral_refine_steps`, and it stays at feral's 10 by default: the
# case gh#710 nominated to justify lowering it (pinene_3200, said to stall in
# the IPM tail without refinement) does not object — measured, it converges to
# the same objective at 10, 1, 0 and refine-off — but the fixture corpus does,
# losing `deb7` (exact) and `cresc4` (L-BFGS) at a cap of 1. So the knob ships
# opt-in. The `_into` forms remove the owned `Vec` every solve entry point used
# to return, ~946 KB of allocate-plus-copy per right-hand side at that
# dimension.
#
# (#177) refined solves now choose between the shared-vector and
# contribution-block solve cores from the factor's structure alone, where the
# choice used to come from `rayon::current_num_threads()`. The two cores are
# different (equally valid) floating-point reassociations, so the same feral on
# the same matrix with the same factor returned different bits on machines with
# different core counts — and feral#16 established that a ULP here is amplified
# by the filter line search into trajectory-level outcomes (141 vs 888 outer
# iterations on qcqp1000-1nc). **This one can move our numbers**, and upstream
# says so in as many words: it is the fix, not a side effect, but a host on the
# other side of the old gate sees its refined solves move in the last bits. It
# is also why the fixture sweep for this bump was run against a 0.15.1 baseline
# rather than reasoned about.
#
# (#134 item B) the scaling router's dense-head gate now counts *symmetric*
# degree rather than the length of a stored lower-triangle column, which was a
# property of the index order and not of the matrix. The IPOPT variable
# convention puts the duals last, so the shape this misrouted is exactly the one
# pounce emits. Monotone — symmetric degree is never below stored degree, so the
# gate only becomes easier to pass — and all 15 families that change route gain
# `Mc64Symmetric`, with identical inertia under both routes on all 15.
#
# (#176) every numeric `FERAL_*` knob was read as
# `env::var(N).ok().and_then(|v| v.parse().ok()).unwrap_or(DEFAULT)`, which
# silently discards scientific notation: `FERAL_CB_THRESH=1e18` parsed as
# nothing and was replaced by the built-in default while the docs wrote that
# same default as `1e6`. The policy now lives in a public `feral::env` module so
# a caller can apply the same rules to its own knobs — and pounce had the
# identical defect on `POUNCE_FERAL_MIN_PAR_FLOPS`, whose documented default we
# print as `1e8`. Those reads now go through `feral::env`.
#
# 0.18.0 (feral#203, #208) fixes nested-dissection separator refinement in all
# three ND orderings. It does not move the default path: `Auto` never selects
# nested dissection (feral#209, open), so a solve that leaves `feral_ordering`
# unset is unchanged. The fixture sweep, both legs, against a 0.17.0 baseline:
# 0 of 194 lines move at the default ordering, and 0 under `auto_race`. Forced
# orderings move 2 (metis, scotch) and 4 (kahip) lines, all on `deb7` and
# `convex_qp_qscfxm1`, and one is a loss: `deb7` (exact) under
# `feral_ordering=scotch` goes `SolveSucceeded`/144 to `ErrorInStepComputation`
# /199. Where nested dissection is set on purpose the fix is large:
# GasLib-40 transient control at 56k/112k variables runs 2.3x/3.6x faster
# under `metis` than on 0.17.0 (2.25x/3.0x per iteration), which makes
# `metis` 2.1x/3.3x faster than the default there. See docs/src/options.md,
# "Collocation, optimal-control and PDE-in-time models: set `metis`".
#
# The release candidate before #208 raced `{Amd, Amf, MetisND}` under
# `auto_race`, and that sent `laptime` to a false local-infeasibility exit;
# the released set is `{Amd, MetisND}`, and `laptime` solves (349 it).
#
# 0.18.0 is the current pin. If you ever need to develop against an unreleased
# feral again, add an UNCOMMITTED `[patch.crates-io]` redirecting feral to the
# git rev — e.g.
#   [patch.crates-io]
#   feral = { git = "https://github.com/jkitchin/feral.git", rev = "<sha>" }
# Do NOT commit that patch (it re-introduces the publish blocker).
feral = { version = "0.18.0" }
# Dense linear algebra for the debugger's numerical rank diagnosis
# (SVD of the active-constraint Jacobian). Pure-Rust, MIT; we pull only
# the dense `std` core — no rayon/sparse/rand/npy.
faer = { version = "0.24.0", default-features = false, features = ["std"] }
# `erf` for the AD tape's `TapeOp::Erf` (issue #469). Rust's `std` has no
# error function, and the classic Abramowitz–Stegun series is only ~1e-7
# accurate — not enough for a solver's residuals. `libm` is the rust-lang
# port of musl's libm, so `erf` is the same full-double-precision routine a
# C model would get. Tiny, no_std, no transitive deps. Licensed MIT as of
# 0.2.16 (it was `MIT AND (MIT OR Apache-2.0)` through 0.2.11, before libm
# moved into rust-lang/compiler-builtins) — permissive either way, but the
# single-license form is what the lockfile resolves.
libm = "0.2"

# Observability / colored-output stack (pounce#71). `anstyle` is the
# style/color vocabulary, `anstyle-query` detects terminal capability
# (truecolor, NO_COLOR, …), `anstream` is the auto-stripping stdout
# wrapper. `tracing` + `tracing-subscriber` provide structured logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi", "json"] }
tracing-log = "0.2"
anstyle = "1"
anstyle-query = "1"
anstream = "0.6"
# Thin libc bindings — used only by pounce-common's `cpu_time()` for the
# Unix `getrusage(RUSAGE_SELF)` user-CPU-time path (port of Ipopt's
# `CpuTime()`); gated behind `cfg(unix)` so non-Unix targets keep the
# wallclock fallback.
libc = "0.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

# `cargo test` defaults to opt-level 0, which is the wrong default for this
# workspace: most of what the suite does is run a numerical solver, and
# unoptimized floating-point kernels are ~10x off. Measured on the full
# `cargo test --workspace --exclude pounce-hsl`:
#
#              build (cold)   test run
#   opt 0           29s          542s
#   opt 2           86s           52s
#
# A 9.9x cut in the test run for +57s of build — net ~4x on total wall-clock,
# and the CI `Test` job is the long pole that sets overall CI time. The worst
# single offender was `pounce_nl`'s harness at 707s of CI's 1182s, dominated by
# two `greedy_hessian_coloring` tests that build multi-million-element pair
# vectors; those two alone go 368s -> 26s.
#
# This is deliberately `profile.test` and not `profile.dev`: it leaves plain
# `cargo build` untouched for local work. Measured separately, `profile.test`
# alone captures the entire win (86s / 52s), so raising `dev` buys nothing.
# `debug_assertions` and overflow checks stay on at opt-level 2, so the tests
# still assert everything they did before.
[profile.test]
opt-level = 2
