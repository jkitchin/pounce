# Build and publish the `pounce-solver` Python extension to PyPI.
#
# Triggers:
#   - push of a tag matching `python-v*`  -> build wheels + sdist, publish to PyPI
#   - workflow_dispatch with `target: testpypi`  -> publish to TestPyPI for dry runs
#   - workflow_dispatch with `target: none`      -> just build artifacts, no upload
#
# Publishing uses PyPI Trusted Publishing (OIDC). The PyPI project
# `pounce-solver` must be configured with this workflow as a Trusted
# Publisher (repository: jkitchin/pounce, workflow filename:
# release-pounce.yml, environment: pypi). Same for TestPyPI under the
# `testpypi` environment.
name: release-pounce

on:
  push:
    tags: ["python-v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to upload (pypi, testpypi, none)"
        required: true
        default: "none"
        type: choice
        options: [pypi, testpypi, none]

permissions:
  contents: read

jobs:
  # Tag-vs-manifest guard (M38). On a `python-v0.5.0` tag push, confirm
  # python/pyproject.toml is actually at 0.5.0 before building/publishing —
  # otherwise the wheels (and the PyPI release) would carry the stale
  # manifest version under the new tag. The build jobs gate on this so a
  # mismatch fails fast, before the 5-platform wheel matrix runs. On manual
  # workflow_dispatch (no release tag) the check step is skipped, so this
  # job is a no-op pass and the build proceeds.
  verify-version:
    name: verify tag matches manifest
    # Gate the whole workflow on the upstream repository: only it can publish
    # to PyPI, and forks receive `python-v*` tags when they sync. Every other
    # job here reaches this one through `needs`, so skipping it skips them all
    # (gh#599).
    if: github.repository == 'jkitchin/pounce'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify tag matches manifest version
        if: github.event_name == 'push'
        env:
          GITHUB_REF: ${{ github.ref }}
        run: python3 scripts/check_tag_version.py "$GITHUB_REF"

  build-wheels:
    name: wheel ${{ matrix.target }} (${{ matrix.os }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: manylinux2014
            rust_target: x86_64-unknown-linux-gnu
            binary_name: pounce
          # GitHub's native arm64 Linux runner — public preview, free for
          # public repos. Switched away from QEMU cross-compile because
          # the standalone `cargo build --bin pounce` step we now do for
          # the bundled CLI does not play well with maturin-action's
          # QEMU container.
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: manylinux2014
            rust_target: aarch64-unknown-linux-gnu
            binary_name: pounce
          - os: macos-14       # macOS arm64 runner (Apple Silicon)
            target: aarch64
            manylinux: ""
            rust_target: aarch64-apple-darwin
            binary_name: pounce
          # x86_64 macOS wheel — cross-compiled from the Apple Silicon
          # runner. The macos-13 (Intel) runner pool is unreliable
          # (jobs queue for hours); cross-compiling from macos-14 has
          # the same coverage for Intel Mac users at a fraction of
          # the wait time.
          - os: macos-14
            target: x86_64
            manylinux: ""
            rust_target: x86_64-apple-darwin
            binary_name: pounce
          - os: windows-latest
            target: x64
            manylinux: ""
            rust_target: x86_64-pc-windows-msvc
            binary_name: pounce.exe
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pounce-cli-${{ matrix.rust_target }}

      # Build the standalone pounce CLI binary and stage it inside the
      # Python package source tree. `[tool.maturin] include` in
      # pyproject.toml then pulls it into the wheel under pounce/bin/.
      #
      # macOS / Windows ONLY. On Linux this moved into the manylinux
      # container — see `before-script-linux` on the maturin step below and
      # the explanation there (#452).
      - name: Build pounce CLI binary
        if: runner.os != 'Linux'
        run: cargo build --release --bin pounce --target ${{ matrix.rust_target }}

      - name: Stage CLI binary into the wheel
        if: runner.os != 'Linux'
        shell: bash
        run: |
          mkdir -p python/pounce/bin
          cp "target/${{ matrix.rust_target }}/release/${{ matrix.binary_name }}" \
             "python/pounce/bin/${{ matrix.binary_name }}"
          ls -l python/pounce/bin/

      - name: Build wheel (maturin)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # abi3-py39 means one wheel per platform covers py39+.
          args: --release --out dist
          sccache: "true"
          # THE FIX FOR #452. On Linux the bundled CLI is built HERE, inside
          # the manylinux container, rather than on the runner beforehand.
          #
          # The old arrangement built it on the host and only then handed the
          # tree to maturin. maturin then built the extension module inside
          # manylinux2014 (glibc 2.17) and labelled the wheel to match — but
          # the CLI sitting next to it had been linked against the runner's
          # glibc (Ubuntu 24.04 = 2.39). auditwheel does not inspect
          # pounce/bin/pounce; to the wheel format it is opaque data, not a
          # linked object. So the wheel promised 2.17 and shipped a binary
          # needing 2.39, and `pounce` could not start on Debian 12, RHEL
          # 8/9, or most cluster images — while every CI check passed,
          # because they all ran on the same 2.39 host that built it.
          #
          # Building in the container makes the promise and the artifact come
          # from the same place, which is the only arrangement that cannot
          # drift. Nothing about the source changes: POUNCE is pure Rust, so
          # the container only has to supply a linker.
          #
          # No --target: the container's host triple is already the right one
          # for this matrix entry (x86_64 or aarch64 manylinux2014).
          before-script-linux: |
            set -eux
            # sccache: "true" exports RUSTC_WRAPPER=sccache and the action
            # forwards it into the container, but sccache is installed on the
            # HOST — inside here cargo would try to exec a wrapper that does
            # not exist ("could not execute process `sccache ...`"). maturin's
            # own build later gets a container-local sccache; this pre-step
            # does not need one.
            unset RUSTC_WRAPPER
            # The action's working directory is python/; walk up to the
            # workspace root rather than assuming a fixed mount path.
            d="$PWD"
            while [ "$d" != "/" ] && [ ! -f "$d/Cargo.toml" ]; do d="$(dirname "$d")"; done
            # Subshell, deliberately. maturin runs from this SAME script
            # afterwards and expects to still be in python/. A bare `cd` here
            # leaked the workspace root into that invocation, where maturin
            # parsed the workspace Cargo.toml and died with
            # "missing field `package`".
            (
              cd "$d"
              # actions/checkout marks the repo safe in the RUNNER's git
              # config, but this container has its own HOME (/root), so git
              # here sees a mounted tree owned by another uid and refuses it
              # as dubiously-owned. crates/pounce-cli/build.rs shells out to
              # git for the commit it stamps into `pounce --about`; without
              # this the binary reports "unknown" and pyomo-pounce's
              # build-id checks fail against it.
              git config --global --add safe.directory "$d" || true
              ldd --version
              cargo build --release --locked --bin pounce
              mkdir -p python/pounce/bin
              cp target/release/pounce python/pounce/bin/pounce
              ls -l python/pounce/bin/
            )

      # The guard that was missing (#452). Every pre-existing check ran on
      # the host that built the binary — the one platform where a glibc floor
      # cannot show up. Assert the property on the artifact instead. Runs on
      # the host after the container build; the staged binary persists there
      # because the workspace is mounted into the container.
      - name: Verify bundled CLI honors the manylinux2014 floor
        if: runner.os == 'Linux'
        run: scripts/check-cli-portability.sh python/pounce/bin/pounce 2.17

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: python/dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: sdist
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: python/dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    name: publish to PyPI
    needs: [build-wheels, build-sdist]
    if: startsWith(github.ref, 'refs/tags/python-v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pounce-solver/
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: publish to TestPyPI
    needs: [build-wheels, build-sdist]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pounce-solver/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
