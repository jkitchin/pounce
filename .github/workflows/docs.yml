name: Deploy docs

on:
  # main rebuilds the dev/ docs. A release additionally needs the versioned
  # site rebuilt (new archive entry + stable pointer) — but GitHub Pages only
  # *serves* deployments from the source branch (main), so a tag-triggered run
  # reports success yet never publishes (docs-deploy postmortem, 0.6.0). So
  # instead of `tags: ['v*']` we ride `workflow_run` after the crates release:
  # that event runs in the default-branch (main) context, so it deploys from
  # main (and therefore actually publishes), and by the time it fires the new
  # vX.Y.Z tag already exists, so build-versioned-docs.sh picks it up as stable.
  push:
    branches: [main]
  workflow_run:
    workflows: ["release-crates"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pin mdBook so archived-tag rebuilds are reproducible and the inline
  # `path_to_root` the selector injection relies on stays stable. Matches the
  # version used locally to author scripts/build-versioned-docs.sh.
  MDBOOK_VERSION: "0.5.2"

jobs:
  build:
    runs-on: ubuntu-latest
    # Two gates, both of which skip `deploy` as well (it `needs: build`).
    #
    # 1. Only the upstream repository can deploy this site — a fork has no
    #    Pages environment set up for it, so `deploy` fails there. "Sync fork"
    #    pushes to the fork's main and fires this workflow, which is how forks
    #    ended up with a red X and an email per sync (gh#599).
    # 2. On the release (workflow_run) trigger, only rebuild if the release
    #    actually succeeded; push/dispatch runs are unconditional.
    if: >-
      github.repository == 'jkitchin/pounce' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion == 'success')
    steps:
      # fetch-depth: 0 — the versioned build checks out each v* tag via
      # `git worktree`, so the full tag history must be present (the default
      # shallow clone has none).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install mdbook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: ${{ env.MDBOOK_VERSION }}

      # The docs assistant (docs/src/ask.md) searches the wiki as well as the
      # book, so the wiki — a separate repository, jkitchin/pounce.wiki — has
      # to be on disk when the index is built. Depth 1: only the current text
      # is indexed, never the history.
      #
      # `continue-on-error` is deliberate and is the whole reason this is its
      # own step. A wiki that is unreachable, renamed, or emptied must not
      # take the docs site down with it; build-versioned-docs.sh then sees no
      # POUNCE_WIKI_DIR (the `if` on the env below), builds a book-only index,
      # and the assistant loses the wiki passages but nothing else. The step
      # shows up amber in the run, so the degradation is visible rather than
      # silent.
      - name: Clone the wiki (assistant corpus)
        id: wiki
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/jkitchin/pounce.wiki.git \
            "$GITHUB_WORKSPACE/wiki"
          ls -1 "$GITHUB_WORKSPACE/wiki"/*.md | wc -l

      # Builds stable (latest tag) -> site root, main -> site/dev/, and each
      # v* tag -> site/<tag>/, then builds the assistant's retrieval index and
      # injects the version selector and the assistant into every page.
      # Strict: any version failing to build fails the job, so the last good
      # site stays live.
      - name: Build versioned site
        env:
          POUNCE_WIKI_DIR: ${{ steps.wiki.outcome == 'success' && format('{0}/wiki', github.workspace) || '' }}
        run: scripts/build-versioned-docs.sh "$GITHUB_WORKSPACE/site"

      # The assistant fails soft in the browser — no index means it shows an
      # error in its own panel and the rest of the page is fine — so a
      # mis-staged index would only ever be found by a reader. Assert here
      # instead: the index exists at the site root, and the injected tag
      # actually reached a nested page (the depth case `data-index` exists to
      # get right).
      - name: Assert the assistant was staged
        run: |
          test -s "$GITHUB_WORKSPACE/site/ask-index.json"
          test -s "$GITHUB_WORKSPACE/site/ask.js"
          test -s "$GITHUB_WORKSPACE/site/ask.css"
          grep -q 'data-index="../../ask-index.json"' \
            "$GITHUB_WORKSPACE/site/dev/schema/solve-report-v1.html"

      # The in-browser solvers (docs/src/wasm.md) ride the same Pages
      # deployment: the drag-and-drop `.nl` app at <site>/demo/ and the
      # Pyodide + Pyomo scripting app at <site>/demo/python/. Both are
      # version-independent — one live build from main, not one per archived
      # tag — so they are staged here rather than inside
      # build-versioned-docs.sh, which wipes and rebuilds its output
      # directory per version.
      #
      # Nothing about it needs special Pages configuration: no threads, so
      # no SharedArrayBuffer and no COOP/COEP headers (which Pages cannot
      # set anyway), and every URL the page fetches is relative, so it works
      # under the /pounce/ base path unchanged.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Build the in-browser solver demo
        run: crates/pounce-wasm/build.sh
      - name: Stage the demos into the site
        run: |
          mkdir -p "$GITHUB_WORKSPACE/site/demo" "$GITHUB_WORKSPACE/site/demo/python"
          cp -a crates/pounce-wasm/web/. "$GITHUB_WORKSPACE/site/demo/"
          cp -a crates/pounce-wasm/web-python/. "$GITHUB_WORKSPACE/site/demo/python/"
          find "$GITHUB_WORKSPACE/site/demo" -name .gitignore -delete
          rm -rf "$GITHUB_WORKSPACE/site/demo/python/__pycache__"
          test -s "$GITHUB_WORKSPACE/site/demo/pounce.wasm"
          test -s "$GITHUB_WORKSPACE/site/demo/python/pounce.wasm"
          # The emscripten wheel is committed rather than built here; if it
          # ever stops being staged, `import pounce` on the live demo fails
          # and only a visitor would find out.
          test -s "$GITHUB_WORKSPACE/site/demo/python/wheels/pounce-wheel.json"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
