name: CI

# A bare `push:` alongside `pull_request:` runs the entire workflow twice for
# every commit on a branch with an open PR — once per event, on the same SHA.
# Both runs are full duplicates (measured on 40a1e9e0's parent: Test took 1256s
# and 1270s in the two runs of the same commit), so scoping push to `main`
# halves CI for PR work. The trade-off: a branch pushed *without* an open PR no
# longer gets a run. Open the PR (draft is enough) to get CI on it.
on:
  push:
    branches: [main]
  pull_request:

# Superseded runs are wasted work — a force-push or a quick follow-up commit
# leaves the earlier run grinding for its full ~20 minutes with nobody reading
# the result. Cancel in-flight runs for the same ref, but never on `main`,
# where each commit's result is the record of that commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      # Release guard: the three registry versions (Rust workspace,
      # pounce-solver wheel, pyomo-pounce) must agree, and the crates.io
      # publish list in scripts/publish-crates.sh must match the workspace's
      # publishable crates in topological order. Catches release drift (e.g.
      # the publish list naming crates that no longer exist) on every PR
      # rather than at tag time. Needs cargo metadata (feral resolves from
      # crates.io) and python3 (preinstalled on ubuntu-latest).
      - name: Release consistency check
        run: scripts/check-release-consistency.sh

      # Docs guard (#108): every page under docs/src must be reachable from
      # SUMMARY.md and every TOC link must resolve, so a newly written page
      # can't ship in the repo while staying invisible in the book.
      - name: Docs consistency check
        run: scripts/check-docs-consistency.sh

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        # Gate on lints that signal real bugs (`correctness`,
        # `suspicious`). `perf` is excluded because its current hits are
        # benign micro-opts in test code (`useless_vec!` on fixed-size
        # buffers); revisit if a real perf-relevant lint surfaces. Other
        # groups (style, restriction, pedantic) stay as informational
        # warns, matching Cargo.toml's workspace lint policy.
        run: cargo clippy --workspace --exclude pounce-hsl --all-targets -- -D clippy::correctness -D clippy::suspicious

      - name: Build
        run: cargo build --workspace --exclude pounce-hsl --verbose

      - name: Test
        run: cargo test --workspace --exclude pounce-hsl --verbose

      # The pounce-rs facade's convex / active-set-QP / sensitivity modules are
      # behind off-by-default features (gh #561), so the workspace steps above
      # — which build the default feature set — never compile them. Without
      # this step a re-export could stop matching the crate it mirrors and
      # nothing would notice until a user enabled the feature. Cheap: the
      # crates involved are already compiled by the workspace build.
      - name: Test pounce-rs facade with all features
        run: |
          cargo clippy -p pounce-rs --all-features --all-targets -- \
            -D clippy::correctness -D clippy::suspicious
          cargo test -p pounce-rs --all-features --verbose

      # pounce-hsl is excluded from the build/test/clippy steps above because
      # it FFI-links libcoinhsl (HSL is licensed and absent from CI), so those
      # steps can't link it. But it IS on the crates.io publish list
      # (scripts/publish-crates.sh, 5th of 19), and without this step nothing
      # in CI ever compiles it: a type/syntax error would first surface during
      # the `cargo publish` verify build mid-release — after the four crates
      # ahead of it have already been irreversibly published (M39).
      # `cargo check` type-checks the crate (lib + tests via --all-targets)
      # without linking; build.rs degrades to a plain rlib with no link
      # directives when COINHSL_DIR is unset, so this needs no HSL install.
      - name: Compile-check pounce-hsl (publishable, link-excluded above)
        run: cargo check -p pounce-hsl --all-targets --verbose

  # Guard the browser build (crates/pounce-wasm, docs/src/wasm.md). The
  # `test` job type-checks pounce-wasm on the host, which catches neither of
  # the two ways this surface breaks: a dependency that stops compiling for
  # wasm32 (a new `libc`/`dlopen`/thread call somewhere in the tree), and one
  # that compiles but traps at run time on a syscall WASI does not have. A
  # third is the wasm-opt post-processing step, which is what the page and the
  # demo actually ship. The smoke test drives the same C ABI the page uses —
  # load a `.nl`, solve it, check the objective — under Node's WASI.
  wasm:
    name: WebAssembly build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `build.sh` runs wasm-opt only when binaryen is on PATH and silently
      # falls back to `cp` otherwise, so a CI runner without binaryen exercises
      # the fallback and never the optimizer. That blind spot is how the
      # validation failure this step now guards reached main: wasm-opt rejected
      # the module ("Fatal: error validating input") because Rust's
      # wasm32-wasip1 output uses non-trapping float-to-int and SIMD, and since
      # build.sh runs under `set -euo pipefail` that was a hard build failure
      # for every contributor who had binaryen installed — while CI stayed
      # green. Installing it here means CI builds what those contributors and
      # the deployed page actually get.
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build the wasm module
        run: crates/pounce-wasm/build.sh
      - name: Solve a model in wasm
        run: node crates/pounce-wasm/tests/smoke.mjs

      # The Python-page highlighter is one regex with alternation — the kind
      # of code that breaks quietly (a mis-numbered backreference once made
      # every string containing an escape fall apart, and the page still
      # rendered, just wrong).
      - name: Highlighter tokens
        run: node crates/pounce-wasm/tests/editor_tokens.mjs

      # The Pyodide app's Python layer (web-python/pounce_browser.py) maps
      # the `.sol` blocks back onto Pyomo components by writer order. Getting
      # that wrong puts plausible numbers on the wrong variables, which no
      # Rust-side test can see — so drive the real round trip here, with Node
      # standing in for the browser.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Pyomo round trip through wasm
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyomo
          python crates/pounce-wasm/tests/pyomo_roundtrip.py

  # Exercise the Python surface (the `pounce.jax` differentiable /
  # sensitivity / path-following APIs) on every PR. The Rust `test` job
  # above covers the solver core, and `wheel-smoke` only imports the
  # package — neither runs pytest, so without this job the entire
  # Python feature surface lands untested in CI. Builds the wheel the
  # same way wheel-smoke does, then installs the jax + diffrax extras
  # and runs the test suite.
  python-test:
    name: Python tests (jax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: x86_64
          manylinux: manylinux2014
          args: --release --out dist
          sccache: "true"
      - name: Install wheel + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install python/dist/*.whl pytest scipy "jax[cpu]" diffrax
          # `gamsapi[core]` is GAMS's own PyPI package: pure Python, no GAMS
          # install and no license needed. It is here so the GAMS link's
          # `gmoModelStat_*` / `gmoSolveStat_*` constants can be checked
          # against GAMS's definitions rather than against a comment. Three of
          # them were wrong, and a wrong integer there is invisible without
          # GAMS in the loop — the link runs, the value is in range, and the
          # `.lst` just says the wrong thing.
          python -m pip install "gamsapi[core]"
      - name: Run Python tests
        run: python -m pytest python/tests -q

  # Exercise the PyTorch frontend (`pounce.torch`, pounce#109) on every
  # PR. Mirrors `python-test` but installs the CPU torch wheel alongside
  # jax so both the torch suite and the JAX↔Torch parity fixtures run.
  python-test-torch:
    name: Python tests (torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: x86_64
          manylinux: manylinux2014
          args: --release --out dist
          sccache: "true"
      - name: Install wheel + test deps
        run: |
          python -m pip install --upgrade pip
          # CPU torch wheel — pounce solves on the host, no CUDA needed.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install python/dist/*.whl pytest scipy "jax[cpu]"
      - name: Run Python torch + parity tests
        run: |
          python -m pytest python/tests/test_torch.py \
            python/tests/test_qp_torch.py \
            python/tests/test_socp_torch.py \
            python/tests/test_parity_jax_torch.py -q

  # Smoke-build the `pounce-solver` wheel on every PR so packaging
  # regressions surface here, not at tag time. Runs only on Linux
  # x86_64; the full multi-platform matrix lives in release-pounce.yml
  # and fires on tag push. Mirrors that workflow's bundle-the-CLI flow.
  wheel-smoke:
    name: wheel smoke (pounce-solver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Mirrors release-pounce.yml: the bundled CLI is built INSIDE the
      # manylinux container, not on this runner (#452). Building it here with
      # a plain `cargo build` is precisely what let a glibc-2.39 binary ship
      # inside a manylinux2014-tagged wheel — and nothing downstream could
      # notice, because every check ran on the same host that built it.
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: x86_64
          manylinux: manylinux2014
          args: --release --out dist
          sccache: "true"
          before-script-linux: |
            set -eux
            # sccache: "true" exports RUSTC_WRAPPER=sccache and the action
            # forwards it into the container, but sccache is installed on the
            # HOST — inside here cargo would try to exec a wrapper that does
            # not exist ("could not execute process `sccache ...`"). maturin's
            # own build later gets a container-local sccache; this pre-step
            # does not need one.
            unset RUSTC_WRAPPER
            d="$PWD"
            while [ "$d" != "/" ] && [ ! -f "$d/Cargo.toml" ]; do d="$(dirname "$d")"; done
            # Subshell, deliberately. maturin runs from this SAME script
            # afterwards and expects to still be in python/. A bare `cd` here
            # leaked the workspace root into that invocation, where maturin
            # parsed the workspace Cargo.toml and died with
            # "missing field `package`".
            (
              cd "$d"
              # actions/checkout marks the repo safe in the RUNNER's git
              # config, but this container has its own HOME (/root), so git
              # here sees a mounted tree owned by another uid and refuses it
              # as dubiously-owned. crates/pounce-cli/build.rs shells out to
              # git for the commit it stamps into `pounce --about`; without
              # this the binary reports "unknown" and pyomo-pounce's
              # build-id checks fail against it.
              git config --global --add safe.directory "$d" || true
              ldd --version
              cargo build --release --locked --bin pounce
              mkdir -p python/pounce/bin
              cp target/release/pounce python/pounce/bin/pounce
            )
      - name: Verify bundled CLI honors the manylinux2014 floor
        run: scripts/check-cli-portability.sh python/pounce/bin/pounce 2.17
      - name: Install + smoke (Python API + CLI)
        run: |
          ls -l python/dist/
          python -m pip install --upgrade pip
          python -m pip install python/dist/*.whl
          python -c "import pounce; print('import ok:', pounce.__file__)"
          # The console-script entry should now exist on PATH and shim
          # to the bundled binary. `--help` exercises the full execve
          # round-trip without needing an actual .nl input file.
          which pounce
          pounce --help | head -5
      # The check the previous arrangement could not make. Everything above
      # runs on the host that built the binary, where a glibc floor is
      # invisible by construction (#452). Install the same wheel on a distro
      # far older than the runner and actually solve a problem on it.
      # manylinux2014 is glibc 2.17 — the floor the wheel advertises, and
      # older than any machine we care about.
      - name: Solve with the wheel on old glibc (glibc 2.17)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" -w /w quay.io/pypa/manylinux2014_x86_64 bash -euxc '
            ldd --version
            PY=/opt/python/cp39-cp39/bin/python
            "$PY" -m pip install -q /w/python/dist/*.whl
            BIN=$("$PY" -c "import pounce,os;print(os.path.join(os.path.dirname(pounce.__file__),\"bin\",\"pounce\"))")
            "$BIN" --version
            "$BIN" --problem rosenbrock --no-sol
            "$PY" -c "import pounce; print(\"import ok on glibc 2.17:\", pounce.__version__)"
          '

  # Smoke-build the pyomo-pounce wheel and run its test suite. Pure-Python
  # now: the `pounce` binary comes from the `pounce-solver` dep, not bundled
  # here. We build the wheel, install it alongside a locally-built `pounce`
  # on PATH (since `pounce-solver` may not yet be on PyPI at PR time), confirm
  # the plugin resolves the executable, then run `pytest pyomo-pounce/tests`
  # end-to-end against that binary. The pytest step exercises actual solves
  # (option forwarding, routing) that a plain import smoke test cannot —
  # without it, routing regressions like pounce#186 ship silently.
  #
  # This is also the ONLY job where Pyomo runs at all: it is not a
  # dev-dependency of the workspace, so nothing else here can catch a
  # Pyomo-side regression. Since gh#558 that includes both of the
  # interfaces pyomo-pounce registers — the legacy ASL plugin and the
  # `pyomo.contrib.solver` (v2) one — and `tests/test_v2.py` solves one
  # model through both and compares primals, duals and reduced costs.
  # That comparison is what keeps the interface table in
  # `docs/src/pyomo.md` honest (it was hand-produced and went stale the
  # moment Pyomo renamed anything) and what pins the two #553
  # ASL-compatibility fixes from the Python side: quoted option values
  # and the per-model `.sol` `Options` echo are exercised on every v2
  # solve, where before they were covered by Rust unit tests only.
  pyomo-pounce-smoke:
    name: wheel smoke (pyomo-pounce)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install --upgrade pip build
      - name: Build pyomo-pounce wheel + sdist
        working-directory: pyomo-pounce
        run: |
          python -m build
          ls -l dist/
      # Build the pounce-solver wheel from THIS branch and install it, so the
      # in-process sensitivity session (`pyomo_pounce.sens` does `import pounce`
      # and calls the new solver methods) has a real Python solver — not just
      # the CLI. The wheel bundles the CLI, so its console script also satisfies
      # the SolverFactory plugin's `.solve()` path. The pyomo-pounce sensitivity
      # tests exercise both.
      # As in wheel-smoke: CLI built inside the manylinux container (#452).
      - name: Build pounce-solver wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: x86_64
          manylinux: manylinux2014
          args: --release --out dist
          sccache: "true"
          before-script-linux: |
            set -eux
            # sccache: "true" exports RUSTC_WRAPPER=sccache and the action
            # forwards it into the container, but sccache is installed on the
            # HOST — inside here cargo would try to exec a wrapper that does
            # not exist ("could not execute process `sccache ...`"). maturin's
            # own build later gets a container-local sccache; this pre-step
            # does not need one.
            unset RUSTC_WRAPPER
            d="$PWD"
            while [ "$d" != "/" ] && [ ! -f "$d/Cargo.toml" ]; do d="$(dirname "$d")"; done
            # Subshell, deliberately. maturin runs from this SAME script
            # afterwards and expects to still be in python/. A bare `cd` here
            # leaked the workspace root into that invocation, where maturin
            # parsed the workspace Cargo.toml and died with
            # "missing field `package`".
            (
              cd "$d"
              # actions/checkout marks the repo safe in the RUNNER's git
              # config, but this container has its own HOME (/root), so git
              # here sees a mounted tree owned by another uid and refuses it
              # as dubiously-owned. crates/pounce-cli/build.rs shells out to
              # git for the commit it stamps into `pounce --about`; without
              # this the binary reports "unknown" and pyomo-pounce's
              # build-id checks fail against it.
              git config --global --add safe.directory "$d" || true
              cargo build --release --locked --bin pounce
              mkdir -p python/pounce/bin
              cp target/release/pounce python/pounce/bin/pounce
            )
      - name: Install + smoke
        run: |
          # pyomo + numpy (sensitivity needs numpy); networkx + scipy so
          # the incidence surface (test_repair.py / test_block_init.py)
          # actually runs instead of importorskip-ing away — without
          # them the redundancy guard of gh #444 never executes here.
          # The locally-built pounce-solver wheel provides the `pounce`
          # Python package + CLI.
          python -m pip install pyomo numpy pandas networkx scipy
          python -m pip install python/dist/*.whl
          # pyomo-pounce itself installed without deps: its declared
          # pounce-solver dep is satisfied by the wheel installed just above.
          python -m pip install --no-deps pyomo-pounce/dist/*.whl
          which pounce
          python -c "import pyomo_pounce; from pyomo.opt import SolverFactory; s = SolverFactory('pounce'); print('exe:', s.executable())"
          # Both registrations must resolve a usable binary before the
          # suite runs. The v2 interface finds its executable and parses
          # its version through a different code path than the legacy
          # plugin (Pyomo's own Ipopt version parser rejects POUNCE's
          # `pounce X.Y.Z` banner, so `available()` is NotFound without
          # our override) — a plain `import` would not notice.
          python - <<'PY'
          import pyomo_pounce
          from pyomo.contrib.solver.common.factory import SolverFactory as SF2
          s = SF2('pounce')
          print('v2 exe:', s.config.executable.path())
          print('v2 version:', s.version(), 'available:', s.available())
          assert s.version() is not None, "v2 interface could not parse the POUNCE version"
          PY
      - name: Run pyomo-pounce tests
        run: |
          python -m pip install pytest
          # Sensitivity tests (test_sens.py) drive real in-process solves +
          # parametric backsolves through the installed pounce-solver; the
          # AMPL/`.nl` tests exercise the CLI plugin path. Both catch
          # regressions the import smoke test misses.
          python -m pytest pyomo-pounce/tests -q
      # The v2 interface needs Pyomo >= 6.10.1; the package as a whole
      # supports pyomo>=6.0 through the legacy plugin. Everything above
      # installs Pyomo unpinned, i.e. always the newest release, so
      # nothing there exercises the declared floor — it is a claim, not a
      # tested property, and the one time it was wrong the failure mode
      # was `import pyomo_pounce` raising, which takes the LEGACY plugin
      # down with it (gh #558 review).
      #
      # 6.10.0 is the last release below the floor and the one where this
      # actually broke: `pyomo.contrib.solver.common` exists there, so a
      # package-level probe passed, but the loader API is still
      # `SolutionLoaderBase`/`get_primals`. A separate venv keeps this
      # older Pyomo away from the job's real environment.
      - name: Below-floor Pyomo — legacy plugin must still import
        run: |
          python -m venv /tmp/floorenv
          /tmp/floorenv/bin/pip install -q "pyomo==6.10.0" numpy pandas
          /tmp/floorenv/bin/pip install -q python/dist/*.whl
          /tmp/floorenv/bin/pip install -q --no-deps pyomo-pounce/dist/*.whl
          /tmp/floorenv/bin/python - <<'PY'
          import pyomo
          # Must NOT raise: the v2 registration is optional, and a failed
          # import here is the regression this leg exists to catch.
          import pyomo_pounce
          from pyomo.opt import SolverFactory
          print('pyomo', pyomo.version.version,
                '| HAVE_V2_INTERFACE:', pyomo_pounce.HAVE_V2_INTERFACE)
          assert pyomo_pounce.HAVE_V2_INTERFACE is False, (
              "6.10.0 is below the v2 floor; the guard should report the "
              "interface as unavailable rather than claiming it works")
          assert SolverFactory('pounce') is not None, (
              "the legacy plugin must keep working below the v2 floor")
          print('legacy plugin OK below the floor')
          PY
          # ...and the v2 test module skips cleanly rather than erroring
          # at collection.
          /tmp/floorenv/bin/pip install -q pytest
          /tmp/floorenv/bin/python -m pytest pyomo-pounce/tests/test_v2.py \
            -q --no-header -rs 2>&1 | tail -5

  # Build the CasADi `nlpsol` plugin and run its parity suite against
  # CasADi's *bundled Ipopt*, on the same model objects. Nothing else in
  # CI touches `casadi/`: without this job the plugin, and every claim in
  # docs/src/casadi.md about matching Ipopt, is verified only on whatever
  # machine last ran `make -C casadi test`.
  #
  # The plugin subclasses CasADi's internal C++ classes, and the pip wheel
  # ships only public headers — hence the source checkout at exactly the
  # installed version. CasADi performs no version handshake of its own, so
  # a mismatch here is what the build is meant to catch.
  casadi-plugin:
    name: CasADi plugin parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install CasADi
        run: |
          python -m pip install --upgrade pip
          python -m pip install casadi numpy

      # The tag has to match the installed wheel exactly; `make fetch-src`
      # derives it from `casadi.__version__` rather than pinning a literal,
      # so a CasADi release bumps this job automatically.
      - name: Fetch matching CasADi headers
        run: make -C casadi fetch-src

      - name: Build the solver's C library
        run: cargo build --release -p pounce-cinterface

      - name: Build the plugin
        run: make -C casadi

      # 50 checks: primal, both multiplier sets and lam_p against Ipopt;
      # Opti; stats and the per-iteration trace; live iteration callbacks
      # and their throttle; warm starts; the L-BFGS nonlinear-variable
      # mask; the NMPC feedback gain against a re-solve (the
      # bounded-variable trap); active-set SQP and its working-set carry;
      # user-supplied grad_f/jac_g/hess_lag; convexify against Ipopt; a
      # save/load round trip; code generation — compiled with cc and run,
      # its answer required to match the interpreted solve bit for bit; a
      # raising model that must not abort the process; and a threaded map
      # matching serial.
      - name: Parity suite
        run: make -C casadi test

      - name: Examples
        run: make -C casadi examples

      # The wheel is the intended distribution route, so build it and
      # prove it works from a clean environment with nothing but casadi.
      - name: Wheel builds and registers the plugin
        run: |
          cd casadi/wheel && ./build.sh
          python -m venv /tmp/casadi-wheel-env
          /tmp/casadi-wheel-env/bin/pip install -q casadi dist/pounce_casadi-*.whl
          /tmp/casadi-wheel-env/bin/python - <<'PY'
          import casadi as ca
          import pounce_casadi  # registers the plugin in-process
          x = ca.MX.sym("x", 2)
          S = ca.nlpsol("S", "pounce",
                        {"x": x, "f": (1 - x[0])**2 + 100*(x[1] - x[0]**2)**2},
                        {"print_time": False, "pounce": {"print_level": 0}})
          sol = S(x0=[0.5, 0.5])["x"].full().ravel()
          assert abs(sol[0] - 1) < 1e-6 and abs(sol[1] - 1) < 1e-6, sol
          print("pounce-casadi wheel OK, x* =", sol,
                "| builds shipped:", pounce_casadi.supported_casadi_versions())
          PY
