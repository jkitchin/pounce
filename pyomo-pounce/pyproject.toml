[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyomo-pounce"
version = "0.12.0"
description = "Pyomo solver plugin for the POUNCE interior-point NLP solver"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "EPL-2.0"}
authors = [{name = "John Kitchin", email = "jkitchin@andrew.cmu.edu"}]
# Pyomo gives us the SolverFactory machinery; pounce-solver supplies
# the actual `pounce` executable on PATH (it ships the Rust CLI inside
# its wheel). Pinning >=0.1 keeps us forward-compatible across POUNCE
# point releases; tighten if we ever need to coordinate Pyomo/POUNCE
# API changes.
dependencies = [
    "pyomo>=6.0",
    # 0.11.0 is the first release carrying `pounce.sensitivity`, which
    # holds every numeric this package's sens_* functions call. An older
    # wheel imports but every sensitivity entry point raises ImportError,
    # so the floor is a hard requirement, not a preference.
    "pounce-solver>=0.11.0",
    "numpy",
    "pandas",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Eclipse Public License 2.0 (EPL-2.0)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
# The `pyomo.contrib.solver` (v2) interface registered by
# `pyomo_pounce.v2`. Neither floor here applies to the legacy
# SolverFactory('pounce') plugin -- which is why the base stays where it
# is and this is an extra: `pip install pyomo-pounce[pyomo-v2]`. The
# `pyomo` floor is strictly tighter than the base one; the
# `pounce-solver` one is now subsumed by the base `>=0.11.0` and is kept
# because it records WHY the v2 route needs it, which stays true and
# would be needed again if the base floor ever moved back.
#
# NAME: this extra must NOT be called `v2`, and more generally must never
# parse as a PEP 440 version. An extra emits `; extra == "<name>"` into the
# wheel metadata, and packaging's marker evaluator tries `Specifier("==" +
# name)` first, falling back to a string comparison only if that is invalid.
# PEP 440 accepts a leading `v`, so `Specifier("==v2")` *parses* -- the
# marker then takes the version path, and pip's dependency walk (which
# evaluates markers with `extra` set to "") ends up calling `Version("")`
# and raising `InvalidVersion: Invalid version: ''`. That took down every
# `docker/Dockerfile` source build for a day (release-docker on main,
# 2026-08-09 -> 2026-08-10) while `Dockerfile.release` stayed green,
# because the latter installs from PyPI where the extra was not yet
# published.
#
# It reproduces only on packaging < 26 (pip <= 25.x), which is what the
# `python:3.12-slim` runtime stage ships; packaging 26 changed the marker
# evaluator and swallows it. So a modern local pip will NOT show the bug --
# do not conclude from a clean `pip install` on your laptop that an extra
# name is safe.
#
# `pyomo-v2` is safe: the trailing text defeats the version parse, so the
# marker takes the string path. Verify any rename with:
#
#   python3 -c 'from packaging.markers import Marker; \
#     print(Marker("extra == \"NEW\"").evaluate({"extra": ""}))'
#
# * pyomo>=6.10.1 -- `SolutionLoader`/`get_vars`, the loader API this
#   subclasses. `pyomo.contrib.solver.common` exists from 6.9.2, but
#   6.9.2-6.10.0 ship the older `SolutionLoaderBase`/`get_primals`.
# * pounce-solver>0.9.0 -- the v2 route reads the `.sol` through Pyomo's
#   `asl_sol_reader`, which is strict where the legacy reader is lenient:
#   it asserts `n_opts >= 2`, so it needs the per-model `Options` echo
#   added in #553. Released 0.9.0 predates that and fails on every solve
#   through this route. The legacy plugin is unaffected, so this floor
#   belongs here rather than on the base dependency. CI builds the binary
#   from source and would never catch it.
pyomo-v2 = ["pyomo>=6.10.1", "pounce-solver>0.9.0"]

[project.urls]
Homepage = "https://github.com/jkitchin/pounce"
Repository = "https://github.com/jkitchin/pounce"
Issues = "https://github.com/jkitchin/pounce/issues"

[project.entry-points."pyomo.solvers"]
pounce = "pyomo_pounce.pounce_solver"

[tool.setuptools.packages.find]
include = ["pyomo_pounce*"]
