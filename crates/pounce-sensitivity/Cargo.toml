[package]
name = "pounce-sensitivity"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "Sensitivity analysis / parametric NLP warm-start / reduced Hessian for POUNCE — port of upstream Ipopt's sIPOPT contrib (Pirnay, López-Negrete, Biegler 2012)."
keywords = ["sipopt", "sensitivity", "nlp", "ipopt", "parametric"]
categories = ["mathematics", "algorithms", "science"]

[features]
# Mirrors `pounce-cli`'s. The optional pounce-hsl dependency above is
# there only to make this crate a *direct* dependent of it, so cargo
# hands `build.rs` the `DEP_COINHSL_RPATH` its test binaries need.
ma57 = ["dep:pounce-hsl", "pounce-algorithm/ma57"]

[dependencies]
pounce-common.workspace = true
pounce-feral.workspace = true
pounce-linalg.workspace = true
pounce-qp.workspace = true
pounce-algorithm.workspace = true
# Not called from this crate; see the `ma57` feature and `build.rs`.
pounce-hsl = { workspace = true, optional = true }
pounce-nlp.workspace = true
pounce-sens-core.workspace = true
tracing.workspace = true

[dev-dependencies]
# The cross-engine test reads the model Ipopt solved from the same `.nl`.
pounce-nl.workspace = true

[lints]
workspace = true
