[package]
name = "pounce-qp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "Sparse parametric active-set quadratic programming subproblem solver for POUNCE. Drives the active-set SQP NLP path and the parametric corrector inside pounce-sensitivity."
keywords = ["qp", "quadratic", "active-set", "sqp", "solver"]
categories = ["mathematics", "science"]

[dependencies]
pounce-common.workspace = true
pounce-linalg.workspace = true
pounce-linsol.workspace = true
# The linear-independence guard's sparse rank-reveal, whatever backend the
# caller passes for the KKT factorizations (gh#1061). FERAL also backs the
# in-tree unit tests; production callers (pounce-algorithm,
# pounce-sensitivity) construct their own KKT backend and pass it to
# `ParametricActiveSetSolver::new`.
pounce-feral.workspace = true

[lints]
workspace = true
