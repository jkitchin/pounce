[package]
name = "pounce-cinterface"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "C ABI for POUNCE (port of Ipopt's Interfaces/IpStdCInterface.{h,cpp}). Provides CreateIpoptProblem / IpoptSolve / FreeIpoptProblem so existing PyIpopt / cyipopt / JuMP / AMPL clients link without source changes. Feature-complete for the upstream Ipopt C ABI surface."
keywords = ["ipopt", "c-api", "ffi", "nlp", "optimization"]
categories = ["mathematics", "external-ffi-bindings", "api-bindings"]

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
pounce-common.workspace = true
pounce-nlp.workspace = true
pounce-algorithm.workspace = true
pounce-qp.workspace = true
pounce-restoration.workspace = true
pounce-sensitivity.workspace = true
pounce-linsol.workspace = true
pounce-solve-report.workspace = true
pounce-observability.workspace = true
# Not called from this crate. It is here so cargo treats pounce-cinterface
# as a *direct* dependent of pounce-hsl and hands `build.rs` the
# `DEP_COINHSL_RPATH` it needs; see the build script.
pounce-hsl = { workspace = true, optional = true }

[features]
# Mirrors `pounce-cli`'s. Without it `--features pounce-algorithm/ma57`
# still links coinhsl into this crate's test binaries transitively but
# emits no rpath, and they abort at process start (gh#811's defect, third
# package).
ma57 = ["dep:pounce-hsl", "pounce-algorithm/ma57"]

[dev-dependencies]
# `float_roundtrip`: the report tests compare the reals a report carries with
# the getters' bitwise, and serde_json's default parser can land one ulp off
# the value the writer printed (9.035978839861492e-24 read back as ...493e-24).
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints]
workspace = true
