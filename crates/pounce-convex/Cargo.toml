[package]
name = "pounce-convex"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "Interior-point solvers for the convex problem classes in POUNCE: LP, convex QP, and conic programs (SOCP, exponential and power cones, SDP, and SOS) via a Mehrotra predictor-corrector with an HSDE embedding. Shares the pounce-linsol sparse symmetric factorization backbone with the NLP path."
keywords = ["lp", "qp", "interior-point", "convex-optimization", "solver"]
categories = ["mathematics", "science"]

[dependencies]
pounce-common.workspace = true
pounce-linsol.workspace = true
# Dense symmetric eigensolver (cyclic Jacobi) for the QP reduced Hessian,
# shared with the NLP sensitivity path.
pounce-linalg.workspace = true
# Active-set QP engine, retained for the legacy crossover bridge and its
# tests. Acyclic: pounce-qp depends only on pounce-linalg/linsol/common/feral.
pounce-qp.workspace = true
# The linear-equality elimination planner and its reverse-sweep dual
# recovery, shared with the NLP presolve rather than restated here for the
# convex path (gh #494). Acyclic: pounce-presolve depends only on
# pounce-nlp / pounce-common, neither of which reaches pounce-convex.
pounce-presolve.workspace = true
# feral's unsymmetric sparse LU (factor / ftran / btran / column update) is the
# basis engine for the revised-simplex LP crossover (`simplex.rs`). Already a
# transitive workspace dependency via pounce-qp, so no new external crate.
feral.workspace = true
# Data-parallel presolve (duplicate-row hashing); already a transitive
# workspace dependency via feral, so no new external crate is pulled in.
rayon = "1"
# Structured logging for the cost-normalization (`σ`) decisions. Until gh #846
# this file emitted nothing at all, so an accepted normalized optimum and a
# rejected one were indistinguishable from outside — see `solve_qp_core`.
# Already a workspace dependency of nine other crates; no new external crate.
tracing.workspace = true

[dev-dependencies]
# FERAL backs the in-tree unit tests so the IPM runs end-to-end against
# a real sparse symmetric factorization without external solvers.
pounce-feral.workspace = true

[lints]
workspace = true
