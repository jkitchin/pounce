[package]
name = "pounce-nl"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "AMPL .nl reader, reverse-mode AD tape, and TNLP evaluator for pounce"

# The .nl pipeline (parser → Expr DAG → reverse-mode AD tape → NlTnlp)
# lives here as a leaf crate so both the CLI and the Python bindings can
# read a `.nl` file and evaluate objective/gradient/Hessian +
# constraints/Jacobian without either depending on the other.
[dependencies]
pounce-common.workspace = true
pounce-nlp = { workspace = true, features = ["serde"] }
tracing.workspace = true
# `erf` for `TapeOp::Erf` / `UnaryOp::Erf` — see the workspace dependency
# comment for why this is not hand-rolled.
libm.workspace = true

# AMPL imported (external) functions are `dlopen`ed at solve time, which
# only exists on unix/windows. Targets without a dynamic loader — notably
# `wasm32-*`, where the whole `.nl` pipeline still has to build for the
# browser demo (`crates/pounce-wasm`) — get the stub `ExternalLibrary::load`
# in `nl_external.rs`, which reports that such models can't be evaluated
# there rather than failing to compile.
# Parallel Hessian/Jacobian evaluation. Target-gated because this crate also
# builds for `wasm32-unknown-unknown` (the browser demo reaches the whole `.nl`
# pipeline through `pounce-wasm`), where rayon has no threads to hand out; the
# evaluators fall back to their serial walks under `cfg(target_arch = "wasm32")`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"

[target.'cfg(any(unix, windows))'.dependencies]
libloading = "0.8"

[lints]
workspace = true
