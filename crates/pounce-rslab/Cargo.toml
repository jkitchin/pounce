[package]
name = "pounce-rslab"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
publish = false
description = "Experimental RSLAB sparse symmetric LDL^T backend for POUNCE. Implements pounce-linsol's SparseSymLinearSolverInterface alongside pounce-feral (FERAL) and pounce-hsl (MA57)."
keywords = ["rslab", "ldl", "linear-solver", "sparse", "ipopt"]
categories = ["mathematics", "algorithms"]

[dependencies]
pounce-common.workspace = true
pounce-linsol.workspace = true
rslab.workspace = true
tracing.workspace = true
# The cross-solver harness in `src/compare.rs` measures FERAL and RSLAB
# through the same code path; a harness that drove one from `src/` and the
# other from a dev-only shim would not be comparing like with like. This crate
# is `publish = false` and is not a default-member, so the extra edge costs a
# normal build nothing.
pounce-feral.workspace = true
# MA57 is the third arm of the comparison where the HSL library is on the link
# path. Absent, the harness records it as unavailable rather than skipping the
# comparison.
pounce-hsl = { workspace = true, optional = true }

[dev-dependencies]
# The real-KKT examples run an actual POUNCE solve and capture the KKT
# systems the IPM hands its linear solver. Dev-only: the adapter itself has
# no edge into the optimizer, and pounce-algorithm has none into this crate,
# so there is no cycle.
pounce-algorithm.workspace = true
pounce-nl.workspace = true
pounce-nlp.workspace = true

[features]
default = []
# Add the HSL MA57 arm to the cross-solver harness. Requires libcoinhsl.
ma57 = ["dep:pounce-hsl"]

[lints]
workspace = true
